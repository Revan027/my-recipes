name: Build Android APK

# Se déclenche uniquement sur les push de la branche principale (master)
on:
  push:
    branches:
      - master
  workflow_dispatch: # permet aussi de lancer le build manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code (+ sous-modules : services communs *.services.common)
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Installation de Node.js (Angular 21 requiert Node 20+)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Installation de Java 21 (requis par Capacitor 8 / Gradle 8.14)
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. Installation du SDK Android + accept des licences
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Installation des dépendances npm
      #    npm install (et non npm ci) : complète le lock pour la plateforme
      #    Linux du runner (binaires sharp/emnapi) au lieu d'exiger un lock
      #    parfaitement synchronisé cross-plateforme.
      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      # 6. Build de l'app Angular
      - name: Build Angular
        run: npm run build

      # 7. Synchronisation Capacitor (copie le build web dans le projet Android)
      - name: Capacitor sync
        run: npx cap sync android

      # 8. Génération de l'APK (debug) via Gradle
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # 9. Publication de l'APK en tant qu'artefact téléchargeable
      - name: Upload de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
