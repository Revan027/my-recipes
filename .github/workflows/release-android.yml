name: Release Android APK

# Se déclenche quand tu pousses un tag de version, avec ou sans "v"
# ex: v1.3.0  OU  1.3.0
on:
  push:
    tags:
      - 'v*'        # ex: v1.0.0
      - '[0-9]*'    # ex: 1.0.0 (sans le v)

permissions:
  contents: write # nécessaire pour créer la Release et y attacher l'APK

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code (+ sous-modules : services communs *.services.common)
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. Node.js (Angular 21 requiert Node 20+)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Java 21 (requis par Capacitor 8 / Gradle 8.14)
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 4. SDK Android
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Calcul de la version depuis le tag (v1.3.0 -> versionName=1.3.0, versionCode=10300)
      - name: Calcul de la version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"          # enlève le "v" du tag
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (code $VERSION_CODE)"

      # 6. Dépendances npm
      #    npm install (et non npm ci) : complète le lock pour la plateforme
      #    Linux du runner (binaires sharp/emnapi) à la volée.
      - name: Installation des dépendances
        run: npm install --no-audit --no-fund

      # 7. Build Angular
      - name: Build Angular
        run: npm run build

      # 8. Capacitor sync
      - name: Capacitor sync
        run: npx cap sync android

      # 9. Injection de la version dans le projet Android
      - name: Injection de la version
        run: |
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.version.outputs.name }}\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.version.outputs.code }}/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      # 10. Génération de l'APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # 11. Renommage de l'APK avec la version
      - name: Renommage de l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk my-recipes-${{ github.ref_name }}.apk

      # 12. Création de la Release GitHub avec l'APK attaché
      - name: Publication de la Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true # génère un changelog auto depuis les commits
          files: my-recipes-${{ github.ref_name }}.apk
