<div class="card">
    <div class="card-header {{ pictureClass() }}">
        @if (recipe().srcPicture) {
            <img class="card-picture" [src]="test()">
        }@else{
            <div class="card-placeholder-picture"></div>
        }
    </div>

    <div class="card-content">
        <div class="card-title">
            <h3>{{ recipe().title }}</h3>
        </div>
    </div>

    <div class="card_footer">
        <div class="card-meta">
            <div class="meta">
                {{ recipe().type.name }}
            </div>
        </div>
    </div>
</div>
