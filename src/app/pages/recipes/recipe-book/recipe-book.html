<div class="recipe-book">
    <div class="action-bar">
        <div class="action-bar-list">
            <div class="action-bar-item">
                <button matFab class="btn-back btn-fab--empty" (click)="onReturnBack()">
                    <mat-icon>navigate_before</mat-icon>
                </button>
            </div>

            <div class="action-bar-item progress-bar-item">
                <app-progress-bar
                    [current]="currentBookPage()"
                    [max]="recipeResult().recipes.length"
                ></app-progress-bar>
            </div>

            <div class="action-bar-item">
                <button matFab extended class="btn-fab--empty" (click)="onEditRecipe()">
                    Modifier
                </button>
            </div>
        </div>
    </div>

    <div #list appSwipe class="recipe-pages">
        @for (recipe of recipeResult().recipes; track recipe.id) {
            <div [attr.data-id]="recipe.id" [id]="`page-${recipe.id}`" class="recipe-page">
                <app-recipe-component [recipe]="recipe" ></app-recipe-component>
            </div>
        } @empty {
            <span>Aucune recette</span>
        }
    </div>
</div>
